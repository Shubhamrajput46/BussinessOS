{% extends "base_auth.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card card-pad">
    <h1>Welcome back</h1>
    <p class="muted">Sign in to your BusinessOS workspace.</p>
    {% include "partials/form_error.html" %}
    <form method="post" novalidate>
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-grid" style="grid-template-columns:1fr">
            <div class="field"><label for="email">Email or username</label>
                <input id="email" name="email" type="text" autocomplete="username" value="{{ posted.email }}" required autofocus></div>
            <div class="field"><label for="password">Password</label>
                <div class="input-group"><input id="password" name="password" type="password" autocomplete="current-password" required>
                <button class="toggle-pass" type="button" aria-label="Show password">Show</button></div>
                <a href="{% url 'password_reset' %}" class="hint" style="align-self:flex-end">Forgot password?</a></div>
        </div>
        <button class="btn btn-primary btn-block mt-2" type="submit">Sign in</button>
    </form>
    <p class="muted text-center mt-2 mb-0">New here? <a href="{% url 'signup' %}">Create a workspace</a></p>
</div>
{% endblock %}
