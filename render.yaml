# Render Blueprint for a MySQL database hosted elsewhere (Render has no MySQL).
# Render: New + > Blueprint > pick this repo, then fill the DB_* values in the dashboard.
services:
  - type: web
    name: businessos
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn Business.wsgi:application --workers 2 --timeout 60"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt
