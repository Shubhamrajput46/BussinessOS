{% if messages %}
<div class="toasts" role="status" aria-live="polite">
    {% for message in messages %}
    <div class="alert toast alert-{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}">
        <span>{{ message }}</span><button type="button" aria-label="Dismiss">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
